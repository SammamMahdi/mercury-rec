[build-system]
requires = ["hatchling"]
build-backend = "hatchling.build"

[project]
name = "mercury-rec"
version = "0.1.0"
description = "Production-grade multi-stage recommendation and personalization platform: candidate retrieval, neural embeddings, learning-to-rank, experimentation, serving, caching and monitoring."
readme = "README.md"
requires-python = ">=3.12,<3.13"
license = { file = "LICENSE" }
authors = [{ name = "Sammam Mahdi" }]
keywords = [
    "recommender-system", "recommendation-system", "learning-to-rank",
    "two-tower", "personalization", "mlops", "feature-engineering",
]
classifiers = [
    "Programming Language :: Python :: 3.12",
    "License :: OSI Approved :: MIT License",
    "Intended Audience :: Science/Research",
    "Topic :: Scientific/Engineering :: Artificial Intelligence",
]

dependencies = [
    # --- numerics / data ---------------------------------------------------
    "numpy>=1.26,<3",
    "pandas>=2.2,<3",
    "pyarrow>=16,<22",
    "scipy>=1.13,<2",
    "scikit-learn>=1.5,<2",
    # --- deep learning -----------------------------------------------------
    # Resolved from the explicit pytorch-cu128 index below. Blackwell (sm_120)
    # is NOT supported by default PyPI wheels; see [tool.uv.sources].
    "torch>=2.9,<3",
    # --- retrieval / ranking ----------------------------------------------
    "faiss-cpu>=1.9,<2",
    "lightgbm>=4.5,<5",
    "shap>=0.46,<1",
    # shap and umap-learn both pull numba -> llvmlite. Without these floors the
    # resolver backtracks to llvmlite 0.36, which hard-fails on Python 3.12
    # ("only versions >=3.6,<3.10 are supported"). Pinned forward instead.
    "numba>=0.60,<1",
    "llvmlite>=0.43,<1",
    # --- validation / config ----------------------------------------------
    "pandera[pandas]>=0.20,<1",
    "pydantic>=2.8,<3",
    "pydantic-settings>=2.4,<3",
    "pyyaml>=6,<7",
    # --- serving -----------------------------------------------------------
    "fastapi>=0.115,<1",
    "uvicorn[standard]>=0.30,<1",
    "orjson>=3.10,<4",
    # --- storage -----------------------------------------------------------
    "sqlalchemy>=2.0,<3",
    "alembic>=1.13,<2",
    "psycopg[binary,pool]>=3.2,<4",
    "redis>=5.0,<7",
    # --- mlops / observability --------------------------------------------
    "mlflow>=2.16,<4",
    "prometheus-client>=0.20,<1",
    "structlog>=24.4,<26",
    # --- cli ---------------------------------------------------------------
    "typer>=0.12,<1",
    "rich>=13.7,<15",
    "httpx>=0.27,<1",
]

[project.optional-dependencies]
viz = [
    # Source-only sdist; JIT-compiles on first call. Used offline, once per
    # model version, by pipelines/project_embeddings.py, which falls back to
    # PCA-3 with a logged warning if this import or fit fails.
    "umap-learn>=0.5.6,<1",
    "matplotlib>=3.9,<4",
]
perf = [
    "locust>=2.31,<3",
    # No cp312 win_amd64 wheel exists; uvicorn silently falls back to the
    # asyncio proactor loop on Windows. Benchmarks record which loop was used.
    "uvloop>=0.20,<1; sys_platform != 'win32'",
]
dev = [
    "pytest>=8.3,<9",
    "pytest-cov>=5.0,<7",
    "pytest-asyncio>=0.24,<2",
    "fakeredis>=2.24,<3",
    "ruff>=0.6,<1",
    "mypy>=1.11,<2",
    "types-pyyaml>=6,<7",
    "pandas-stubs>=2.2,<3",
]

[project.scripts]
mercury = "mercury_rec.cli:app"

[project.urls]
Homepage = "https://github.com/SammamMahdi/mercury-rec"
Repository = "https://github.com/SammamMahdi/mercury-rec"

# ---------------------------------------------------------------------------
# PyTorch on Blackwell (RTX 50-series, sm_120)
#
# Default PyPI torch wheels do not carry sm_120 kernels. Installing them
# produces "no kernel image is available for execution on the device" at the
# first CUDA op. The cu128 index below is marked `explicit`, so ONLY torch is
# drawn from it and every other package still resolves from PyPI.
# `scripts/check_gpu.py` asserts compute capability (12, 0) before training.
# ---------------------------------------------------------------------------
[[tool.uv.index]]
name = "pytorch-cu128"
url = "https://download.pytorch.org/whl/cu128"
explicit = true

[tool.uv.sources]
torch = { index = "pytorch-cu128" }

[tool.hatch.build.targets.wheel]
packages = ["src/mercury_rec"]

# ---------------------------------------------------------------------------
[tool.ruff]
line-length = 100
target-version = "py312"
src = ["src", "tests"]

[tool.ruff.lint]
select = [
    "E", "W",    # pycodestyle
    "F",         # pyflakes
    "I",         # isort
    "N",         # pep8-naming
    "UP",        # pyupgrade
    "B",         # bugbear
    "C4",        # comprehensions
    "SIM",       # simplify
    "PTH",       # use pathlib (Windows path-safety)
    "RUF",
    "ANN",       # type annotations
    "S",         # bandit
    "T20",       # no print() in library code
    "BLE",      # no blind except without justification
]
ignore = [
    "ANN401",  # allow typing.Any where genuinely needed
    "S101",    # assert is fine in tests and invariant checks
    "B008",    # FastAPI Depends() in defaults is the documented idiom
]

[tool.ruff.lint.per-file-ignores]
"tests/**" = ["ANN", "S", "T20"]
# The cache is fail-open BY DESIGN: a Redis outage must degrade latency, not
# availability. Every handler there catches broadly, counts the failure and
# continues, which is the documented behaviour of the module rather than an
# oversight. See the module docstring.
"src/mercury_rec/cache/redis_cache.py" = ["BLE001"]
"scripts/**" = ["T20"]
"src/mercury_rec/cli.py" = ["T20"]

[tool.ruff.lint.isort]
known-first-party = ["mercury_rec"]

# ---------------------------------------------------------------------------
[tool.mypy]
python_version = "3.12"
strict = true
warn_unreachable = true
plugins = ["pydantic.mypy"]
exclude = ["^build/", "^dist/"]

[[tool.mypy.overrides]]
# These ship no type information.
module = ["faiss.*", "lightgbm.*", "shap.*", "umap.*", "mlflow.*", "sklearn.*", "pandera.*", "scipy.*"]
ignore_missing_imports = true

# ---------------------------------------------------------------------------
[tool.pytest.ini_options]
minversion = "8.0"
testpaths = ["tests"]
addopts = "-q --strict-markers --strict-config"
markers = [
    "slow: long-running tests (deselect with '-m \"not slow\"')",
    "gpu: requires a CUDA device",
    "integration: requires live PostgreSQL and/or Redis",
]
filterwarnings = ["error::DeprecationWarning:mercury_rec.*"]

[tool.coverage.run]
source = ["src/mercury_rec"]
branch = true
